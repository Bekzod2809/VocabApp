# VocabApp — nginx sayti (faqat API: sayt/frontend yo'q, ilova APK ichida).
#
# Domen: vocab.169-58-150-96.sslip.io — sslip.io bepul xizmati, IP'ni nomdan o'zi topadi,
# DNS sozlash kerak emas. O'z subdomeningizga o'tilsa (masalan vocab.bekzodxasanov.uz),
# shu fayldagi 4 ta nomni almashtirib, yangi sertifikat olinadi.
#
# Joylash (sertifikat avval olinadi — 00-default sayti acme-challenge'ni o'zi beradi):
#   certbot certonly --webroot -w /var/www/certbot -d vocab.169-58-150-96.sslip.io
#   cp deploy/nginx-vocabapp.conf /etc/nginx/sites-available/vocabapp
#   ln -s /etc/nginx/sites-available/vocabapp /etc/nginx/sites-enabled/vocabapp
#   nginx -t && systemctl reload nginx

upstream vocabapp_api {
    server 127.0.0.1:5090;
    keepalive 8;
}

# HTTP → HTTPS. Certbot yangilash fayli ham shu yerdan o'qiladi.
server {
    listen 80;
    listen [::]:80;
    server_name vocab.169-58-150-96.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `http2` yoqilmagan: nginx 1.24 da u butun 443-portga (boshqa saytlarga ham) ta'sir qiladi
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vocab.169-58-150-96.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/vocab.169-58-150-96.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vocab.169-58-150-96.sslip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Birinchi sinx hamma so'zlarni bir yo'la yuboradi (10 000 tagacha)
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass         http://vocabapp_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Rate limit haqiqiy IP bo'yicha ishlashi uchun (ForwardedHeadersConfigurations.cs)
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass       http://vocabapp_api;
        proxy_set_header Host $host;
        access_log off;
    }

    # Boshqa hamma narsa yopiq
    location / {
        return 404;
    }
}
